          trap 'rm -f "$report" "$output"' EXIT
          npx vitest run __tests__/cross-sink-production-sentinel.postgres-redis.test.ts \
            --reporter=default --reporter=json --outputFile="$report" | tee "$output"
          node - "$report" "$output" <<'NODE'
          const fs = require('node:fs')
          const [reportPath, outputPath] = process.argv.slice(2)
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const output = fs.readFileSync(outputPath, 'utf8')
          const marker = 'S4_CROSS_SINK_PRODUCTION_SENTINEL_OK'
          const markerCount = output.split(marker).length - 1
          const result = report.testResults?.[0]
          if (
            report.testResults?.length !== 1
            || result?.status !== 'passed'
            || result?.assertionResults?.length !== 1
            || report.numTotalTests !== 1
            || report.numPassedTests !== 1
            || report.numFailedTests !== 0
            || report.numPendingTests !== 0
            || report.numTodoTests !== 0
            || report.numFailedTestSuites !== 0
            || report.numPendingTestSuites !== 0
            || markerCount !== 1
          ) {
            throw new Error('The mandatory cross-sink proof must run exactly one file and one passing test with one terminal marker and no skips.')
          }
          NODE
