name: Reconcile Readiness

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only compute readiness without mutating labels
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: forge-readiness-reconcile-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run forge:reconcile
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
