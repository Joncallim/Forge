services:
  postgres:
    image: postgres:16-alpine
    environment:
      # The bootstrap identity is never used by the web or worker services.
      POSTGRES_USER: ${POSTGRES_USER:-forge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for forge_admin}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # One-shot bootstrap lane. It alone receives PostgreSQL administrator and
  # provisioning secrets; it exits before either long-lived application plane
  # is allowed to connect.
  migration:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run db:migrate"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://forge_admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
      FORGE_DATABASE_ADMIN_URL: postgresql://forge_admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
      FORGE_APP_DATABASE_PASSWORD: ${FORGE_APP_DATABASE_PASSWORD:?set FORGE_APP_DATABASE_PASSWORD}
      FORGE_RUNTIME_API_DATABASE_PASSWORD: ${FORGE_RUNTIME_API_DATABASE_PASSWORD:?set FORGE_RUNTIME_API_DATABASE_PASSWORD}
      FORGE_MANAGED_DOCKER_MIGRATIONS: "1"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - ${FORGE_WORKSPACE_ROOT:-${HOME}/Documents/Forge}:/forge-workspace
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://forge:${FORGE_APP_DATABASE_PASSWORD:?set FORGE_APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
      FORGE_RUNTIME_DATABASE_URL: postgresql://forge_runtime_api_login:${FORGE_RUNTIME_API_DATABASE_PASSWORD:?set FORGE_RUNTIME_API_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
      REDIS_URL: redis://redis:6379/0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      FORGE_WORKSPACE_ROOT: /forge-workspace
      FORGE_WORKSPACE_DISPLAY_ROOT: ${FORGE_WORKSPACE_DISPLAY_ROOT:-${FORGE_WORKSPACE_ROOT:-${HOME}/Documents/Forge}}
      FORGE_AGENT_CONFIG_DIR: /forge-workspace/prompts/agents
      FORGE_ENV_FILE: /forge-workspace/config/forge.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    image: node:22-alpine
    profiles: ["worker"]
    working_dir: /app
    volumes:
      - ./web:/app
      - ${FORGE_WORKSPACE_ROOT:-${HOME}/Documents/Forge}:/forge-workspace
    command: sh -c "npm install && npm run worker"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://forge:${FORGE_APP_DATABASE_PASSWORD:?set FORGE_APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
      FORGE_RUNTIME_DATABASE_URL: postgresql://forge_runtime_api_login:${FORGE_RUNTIME_API_DATABASE_PASSWORD:?set FORGE_RUNTIME_API_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-forge}
      REDIS_URL: redis://redis:6379/0
      FORGE_WORKER_CLAIM_TIMEOUT_SECONDS: ${FORGE_WORKER_CLAIM_TIMEOUT_SECONDS:-5}
      FORGE_WORKSPACE_ROOT: /forge-workspace
      FORGE_WORKSPACE_DISPLAY_ROOT: ${FORGE_WORKSPACE_DISPLAY_ROOT:-${FORGE_WORKSPACE_ROOT:-${HOME}/Documents/Forge}}
      FORGE_AGENT_CONFIG_DIR: /forge-workspace/prompts/agents
      FORGE_ENV_FILE: /forge-workspace/config/forge.env

volumes:
  postgres_data:
  redis_data:
